<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aufguss Admin — SaunaFestival 2026</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-page">
  <div class="mobile-block">
    <div>
      <h1>Desktop only</h1>
      <p>Aufguss-admin är byggd för desktop. Öppna på en större skärm.</p>
    </div>
  </div>

  <div id="login-view" class="login-gate panel" hidden>
    <p class="brand-kicker">SaunaFestival 2026</p>
    <h1>Aufguss Admin</h1>
    <p>Schemalägg kvällens poster, platser och anmälan.</p>
    <form id="login-form">
      <div class="field">
        <label for="admin-password">Lösenord</label>
        <input id="admin-password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit">Öppna admin</button>
      <p id="login-status" class="status" role="status"></p>
    </form>
  </div>

  <div id="app-view" class="shell" hidden>
    <header class="admin-header">
      <h1 class="admin-title">LSE Aufguss</h1>
      <div id="night-badge" class="badge">…</div>
    </header>

    <div class="admin-nav">
      <div class="admin-tabs" role="tablist" aria-label="Adminvy">
        <button type="button" class="admin-tab is-active" role="tab" aria-selected="true" data-view="schema" id="tab-schema">
          Schema
        </button>
        <button type="button" class="admin-tab" role="tab" aria-selected="false" data-view="settings" id="tab-settings">
          Inställningar
        </button>
      </div>
      <button type="button" class="btn btn-add" id="btn-add-slot" hidden>Lägg till</button>
    </div>

    <section id="view-schema" class="admin-view" role="tabpanel" aria-labelledby="tab-schema">
      <div id="add-slot-panel" class="admin-add-panel" hidden>
        <form id="add-slot-form" class="toolbar">
          <div class="field" style="min-width:180px;flex:1">
            <label for="new-name">Namn</label>
            <input id="new-name" type="text" required placeholder="Eucalyptus storm">
          </div>
          <div class="field">
            <label for="new-place">Plats</label>
            <select id="new-place" required></select>
          </div>
          <div class="field">
            <label for="new-starts">Start</label>
            <input id="new-starts" type="datetime-local" required>
          </div>
          <div class="field" style="min-width:100px">
            <label for="new-duration">Minuter</label>
            <input id="new-duration" type="number" min="1" value="15" required>
          </div>
          <div class="field" style="min-width:140px">
            <label for="new-oil">Bastuolja</label>
            <input id="new-oil" type="text" placeholder="Tallbarr">
          </div>
          <div class="field" style="min-width:150px">
            <label for="new-meister">Aufgussmeister</label>
            <input id="new-meister" type="text" placeholder="Namn">
          </div>
          <div class="field" style="min-width:100px">
            <label for="new-intensity">Intensitet</label>
            <select id="new-intensity">
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>
          <button class="btn btn-sm" type="submit">Spara post</button>
          <button class="btn btn-ghost btn-sm" type="button" id="btn-cancel-add">Avbryt</button>
        </form>
        <p id="add-status" class="status" role="status"></p>
      </div>

      <div id="schedule-list" class="admin-schedule" aria-live="polite">
        <div class="empty-state">Laddar…</div>
      </div>
      <p id="slots-status" class="status" role="status"></p>
    </section>

    <section id="view-settings" class="admin-view" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <div class="admin-settings-grid">
        <div class="admin-settings-col">
          <h2>Bastus</h2>
          <ul id="places-list" class="admin-places-list">
            <li class="muted">Laddar…</li>
          </ul>
          <p id="places-status" class="status" role="status"></p>
        </div>
        <div class="admin-settings-col">
          <h2>Inställning för när anmälan stänger</h2>
          <div class="admin-close-time">
            <div class="field">
              <label for="signup-closes-at">Tid</label>
              <input id="signup-closes-at" type="time" value="17:00">
            </div>
            <div class="field">
              <label for="night-status">Status</label>
              <select id="night-status">
                <option value="setup">Setup</option>
                <option value="signup_open">Anmälan öppen</option>
                <option value="closed">Stängd (live-schema)</option>
              </select>
            </div>
            <button type="button" class="btn btn-sm" id="btn-save-settings">Spara</button>
          </div>
          <p id="settings-status" class="status" role="status"></p>
        </div>
      </div>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
