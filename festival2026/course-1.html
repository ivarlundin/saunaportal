<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurs 1 - Introduktion</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="course.css">
    <link rel="stylesheet" href="components.css">
    <link
        rel="icon"
        type="image/png"
        href="favicon-saunaportal.png"
    >
</head>

<body class="course-page">
    <script src="profile.js" defer></script>
    <main id="course-app">
        <div class="app-container course-container">
            <header class="app-header">
                <a class="course-brand">Kurs 1 - Introduktion</a>
                <a class="course-dashboard-link" href="courses.html">Tillbaka till kurser →</a>
            </header>

            <section id="course-modal" class="course-modal">
                <div class="course-modal-header">
                    <span id="course-progress" class="step-indicator">STEG 1 AV 3</span>
                </div>
                <div id="course-content" class="step-content"></div>

                <div class="course-navigation">
                    <button type="button" id="course-back" class="secondary-button">← Tillbaka</button>
                    <button type="button" id="course-next" class="primary-button">Nästa →</button>
                </div>
            </section>

            <section id="quiz-panel" class="course-panel" hidden>
                <div class="course-panel-header">
                    <span class="course-mode-label">Quiz</span>
                    <span id="quiz-progress" class="step-indicator">FRÅGA 1 AV 4</span>
                </div>
                <div id="quiz-content" class="step-content"></div>
                <div class="course-navigation">
                    <button type="button" id="quiz-back" class="secondary-button">← Föregående steg</button>
                    <button type="button" id="quiz-next" class="primary-button">Svara →</button>
                </div>
                <div id="quiz-status" class="status course-status" aria-live="polite"></div>
            </section>

            <section id="result-panel" class="course-panel result-content" hidden>
                <div class="result-icon">✓</div>
                <h1>Kurs klar!</h1>
                <p id="result-message">Ditt resultat visas här.</p>
                <div id="result-score" class="result-score">0%</div>
                <button type="button" id="result-dashboard" class="primary-button full-width">Tillbaka till Hem →</button>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="course-quiz.js"></script>
    <script>
        const courseSteps = [
            {
                title: "Hej och välkommen!",
                content: `<img class="course-image" src="illustration-pen-notebook.png" alt="Kursmaterial för SaunaPortal"> 
                <p>Du ska precis börja din resa in i bastuns förtrollade värld. Vi kommer möta många nya termer, men oroa dig inte, vi kommer ta oss igenom detta.</p>
                <p>På din väg genom denna kurs har du gillet och dess förtroendevalda som har utformat denna kurs, just för att du ska kunna hantera bastuns kraftfulla egenskaper säkert.</p>
                <div class="course-content-box" style="text-align: center;">
                    <p>Väl mött, lyckliga bastuönskningar</p>
                    <img src="signature.png" alt="Signatur" style="height: 60px; margin: 15px 0;">
                    <p><strong>Ordförande & styrelsen</strong></p>
                </div>`
            },
            {
                title: "Videokurs: Introduktion",
                content: `<img class="course-image" src="illustration-saunaroom.png" alt="En gemensam bastu"> 
                <p>Du kommer nu få att se ett videoklipp där du kommer få lära dig:</p>
                <ul>
                    <li>Grunderna i bastu</li>
                    <li>Terminologi</li>
                    <li>Bastutyper</li>
                    <li>Säkerhet</li>
                    <li>Grundläggande säkerhet</li>
                </ul>
                <div class="course-content-box">
                    <strong>Nästa steg</strong>
                    <p>Klicka på "Nästa" för att se videon.</p>
                </div>`
            },
            {
                title: "Videokurs",
                content: `<div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin-bottom: 20px; background: #000;">
                    <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" src="https://www.youtube.com/embed/zf4qDPouBz0?si=32JSJh3aIU0iW_2Z&amp;controls=0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
                <p>Titta igenom hela videon för att säkerställa att du har all kunskap som krävs för certifieringen.</p>`
            }
        ];

        const quizQuestions = [
            {
                question: "Vad är en fördel med att göra snabb nedkylning efter bastun?",
                answers: [
                    "Det förseglar värmen och förlänger känslan av värme",
                    "Det drar åt huden så att man ser mer attraktiv ut för damerna",
                    "Det förstärker värmen och kroppstemperaturen"
                ]
            },
            {
                question: "Vilken av följande är inte en grundläggande riktlinje inom Vett & etikett?",
                answers: [
                    "Ingen sång i bastun",
                    "Ta med en handduk in till din lavgranne",
                    "Snabb dörrstängning"
                ]
            },
            {
                question: "Vilket av följande är god förberedelse för en eldning?",
                answers: [
                    "Lövved, 20 st stora klabbar och ett elddon",
                    "Barrved, 15 mindre klabbar och tändvätska",
                    "Lövved, blandade storlekar av klabbar och tändkuddar/tändstickor"
                ]
            },
            {
                question: "Vad indikerar bra eldning och ventilation?",
                answers: [
                    "Tydlig rökdoft i bastun, svaga gula lågor",
                    "Svag rökdoft, kraftfulla röda lågor och en känsla av syre",
                    "Liten till ej märkbar rökdoft, kraftfulla gula lågor"
                ]
            }
        ];

        CourseQuiz.init({
            courseSlug: "course-1",
            courseSteps,
            quizQuestions
        });
    </script>
</body>

</html>
