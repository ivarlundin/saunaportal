<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <script src="platform.js"></script>
    <title>SaunaPortal - Medlemmar</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="forum-members.css">
    <link rel="icon" type="image/png" href="favicon-saunaportal.png">
</head>

<body class="members-page">
    <main class="members-shell">
        <header class="members-header">
            <a class="members-back" href="forum.html">← Tillbaka till forumet</a>
            <img src="sauna-portal-logo.png" alt="SaunaPortal">
        </header>

        <section class="members-hero">
            <h1>Medlemmar</h1>
            <p id="members-lead">Hämtar medlemmar...</p>
        </section>

        <section id="featured-member" class="featured-member" hidden aria-labelledby="featured-title"></section>

        <label class="members-search">
            <span>Sök medlem</span>
            <input id="members-query" type="search" placeholder="Namn eller alias" autocomplete="off">
        </label>

        <section id="members-roster" class="members-roster" aria-live="polite"></section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="forum-members.js"></script>
</body>

</html>
