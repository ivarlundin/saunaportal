<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <script src="platform.js"></script>
    <title>SaunaPortal - Forum</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="forum.css">
    <link rel="stylesheet" href="components.css">
    <link
        rel="icon"
        type="image/png"
        href="favicon-saunaportal.png"
    >
</head>

<body class="forum-page">
        <script src="profile.js" defer></script>
    <main id="forum-app">
        <div class="app-container forum-container">
            <header class="app-header">
                <a class="forum-brand" href="index.html">
                    <img src="sauna-portal-logo.png" alt="SaunaPortal">
                    <span> | Community</span>
                </a>
                <div class="forum-header-actions">
                    <div id="current-user-profile" class="current-user-profile" hidden>
                        <img id="current-user-avatar" class="current-user-avatar" alt="">
                        <span class="current-user-identity">
                            <strong id="current-user-name"></strong>
                            <small id="current-user-alias"></small>
                        </span>
                        <span class="online-status">
                            <span class="online-dot" aria-hidden="true"></span>
                            Online
                        </span>
                    </div>
                    
                    <a class="forum-back-link" href="index.html">Tillbaka</a>
                </div>
            </header>

            <section class="forum-layout">
                <aside class="forum-sidebar">
                        <a class="forum-mobile-back-link" href="index.html">
                            ← Tillbaka
                        </a>
                    <img style="width: 70%;" class="forum-top-baner" src="illustration-sauna-forum.png" alt="Sauna Forum">

                    <div class="forum-title-block">
                        
                        <h1>Forum</h1>
                        <p>Värm upp rummet, diskutera dina önskningar och idéer för festivalen. Kom ihåg att vara respektfull och konstruktiv. Inga spam eller oförskonliga kommentarer om mikrostaten Möckelsnäs.</p>
                    </div>

                    <section class="members-panel" aria-labelledby="members-title">
                        <button
                            type="button"
                            class="members-showcase"
                            id="members-showcase"
                        >
                            <span class="members-showcase-heading">
                                <span id="members-title">Medlemmar</span>
                                <span id="member-count" class="member-count">0</span>
                            </span>
                            <span
                                id="members-list"
                                class="members-showcase-row"
                            ></span>
                        </button>
                    </section>
                </aside>

                <div class="forum-main">
                    <form id="post-form" class="forum-composer" aria-label="Skapa inlägg" data-composer-mode="post">
                        <h2 id="composer-heading">Nytt inlägg</h2>
                        <div class="feed-tabs composer-mode-tabs" id="composer-mode-tabs" role="tablist" aria-label="Inlägg eller omröstning" hidden>
                            <button type="button" class="feed-tab active" data-composer-mode="post" role="tab" aria-selected="true">Inlägg</button>
                            <button type="button" class="feed-tab" data-composer-mode="poll" role="tab" aria-selected="false">Omröstning</button>
                        </div>
                        <textarea
                            id="post-body"
                            maxlength="1000"
                            rows="3"
                            placeholder="Vad vill du dela med festivalen?"
                            required
                        ></textarea>
                        <div id="poll-extra" class="forum-poll-composer" hidden>
                            <fieldset class="poll-options-fieldset">
                                <legend>Alternativ</legend>
                                <div id="poll-options-list" class="poll-options-list">
                                    <input type="text" class="poll-option-input" maxlength="120" placeholder="Alternativ 1">
                                    <input type="text" class="poll-option-input" maxlength="120" placeholder="Alternativ 2">
                                </div>
                                <button type="button" id="poll-add-option" class="secondary-button poll-add-option-button">
                                    + Alternativ
                                </button>
                            </fieldset>
                            <label class="composer-checkbox poll-allow-comments-label">
                                <input type="checkbox" id="poll-allow-comments">
                                Tillåt kommentarer under omröstningen
                            </label>
                        </div>
                        <div class="forum-composer-footer">
                            <span id="composer-status" class="status" aria-live="polite"></span>
                            <button type="submit" id="composer-submit" class="primary-button">
                                Publicera →
                            </button>
                        </div>
                    </form>

                    <section class="feed-section" aria-labelledby="feed-title">
                        <div class="feed-toolbar">
                            <h2 id="feed-title">Inlägg</h2>
                            <div class="feed-tabs" role="tablist" aria-label="Sortera inlägg">
                                <button type="button" class="feed-tab active" data-feed-tab="latest" role="tab" aria-selected="true">Senaste</button>
                                <button type="button" class="feed-tab" data-feed-tab="popular" role="tab" aria-selected="false">Populära</button>
                                <button type="button" class="feed-tab" data-feed-tab="polls" role="tab" aria-selected="false" id="forum-poll-admin-tab" hidden>Omröstningar</button>
                            </div>
                        </div>
                        <div id="post-feed" class="post-feed" aria-live="polite"></div>
                        <div id="feed-sentinel" class="feed-sentinel" aria-hidden="true"></div>
                        <p id="feed-status" class="feed-status" aria-live="polite"></p>
                    </section>

                    <section
                        id="members-directory"
                        class="members-directory"
                        hidden
                        aria-labelledby="members-directory-title"
                    >
                        <button type="button" id="members-directory-back" class="secondary-button members-directory-back">
                            ← Tillbaka till flödet
                        </button>
                        <div class="members-directory-hero">
                            <div>
                                <p class="members-directory-kicker">Bastulaget</p>
                                <h2 id="members-directory-title">Alla medlemmar</h2>
                                <p id="members-directory-lead"></p>
                            </div>
                        </div>
                        <label class="members-directory-search">
                            <span>Sök</span>
                            <input
                                id="members-directory-query"
                                type="search"
                                placeholder="Namn eller alias"
                                autocomplete="off"
                            >
                        </label>
                        <div id="members-directory-list" class="members-directory-list"></div>
                    </section>
                </div>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        window.forumPresence = (() => {
            let members = [];
            let onlineIds = new Set();
            let currentParticipantId = null;
            let updateTimer = null;
            const listeners = new Set();

            function notify() {
                listeners.forEach(listener => listener(onlineIds));
            }

            function scheduleUpdate() {
                window.clearTimeout(updateTimer);
                updateTimer = window.setTimeout(() => {
                    updateOnlineMembers();
                }, 15000 + Math.random() * 5000);
            }

            function updateOnlineMembers() {
                if (!members.length) {
                    onlineIds = new Set();
                    notify();
                    scheduleUpdate();
                    return;
                }

                const minimumOnline =
                    currentParticipantId && members.length > 1
                        ? 2
                        : 1;

                const maximumOnline = Math.min(
                    members.length,
                    Math.max(
                        minimumOnline,
                        Math.floor(members.length * 0.2)
                    )
                );

                const shuffled = [...members]
                    .sort(() => Math.random() - 0.5);

                const selected = shuffled
                    .slice(0, maximumOnline)
                    .map(member => member.id);

                if (
                    currentParticipantId &&
                    !selected.includes(currentParticipantId)
                ) {
                    selected[0] = currentParticipantId;
                }

                onlineIds = new Set(selected);
                notify();
                scheduleUpdate();
            }

            return {
                setMembers(nextMembers, participantId) {
                    members = nextMembers || [];
                    currentParticipantId = participantId || null;
                    updateOnlineMembers();
                },
                isOnline(memberId) {
                    return onlineIds.has(memberId);
                },
                subscribe(listener) {
                    listeners.add(listener);
                    return () => listeners.delete(listener);
                }
            };
        })();
    </script>
    <script src="forum.js" defer></script>
</body>

</html>
