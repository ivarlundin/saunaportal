<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaunaPortal - Kurser</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="components.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .courses-page .app-container { max-width: 920px; }
        .courses-page .courses-content { padding: 28px 24px 44px; }
        .courses-page h1 { margin: 0 0 8px; font-size: 30px; }
        .courses-page .courses-intro { margin: 0 0 24px; line-height: 1.45; }
        .course-catalog { display: grid; gap: 14px; }
        .course-catalog-overview { display: flex; align-items: stretch; gap: 0; padding: 0; background: #d4d4d4; border: 2px solid; border-color: #ffffff #404040 #404040 #ffffff; overflow: hidden; }
        .course-catalog-overview img { width: 220px; height: auto; object-fit: cover; display: block; background: #c0c0c0; border-right: 2px solid #404040; }
        .course-catalog-overview .course-catalog-copy { flex: 1; min-width: 0; padding: 18px; }
        .course-catalog-card { display: flex; align-items: center; gap: 18px; padding: 18px; background: #d4d4d4; border: 2px solid; border-color: #ffffff #404040 #404040 #ffffff; }
        .course-catalog-copy { flex: 1; min-width: 0; }
        .course-catalog-copy h2 { margin: 0 0 6px; font-size: 20px; }
        .course-catalog-copy p { margin: 0 0 8px; line-height: 1.4; }
        .course-catalog-meta { color: #404040; font-size: 12px; }
        @media (max-width: 560px) { .course-catalog-card { align-items: flex-start; flex-direction: column; } }
    </style>
        <script src="profile.js" defer></script>
</head>

<body class="courses-page">
    <main>
        <div class="app-container">
            <header class="app-header">
                <img
                    src="sauna-portal-logo.png"
                    class="app-logo"
                    alt="SaunaPortal"
                    style="height: 40px; width: auto;"
                >
                
                <a class="resource-dashboard-link" href="index.html">Tillbaka till Hem →</a>
            </header>

            <section class="courses-content">
                <h1>Kurser</h1>
                <p class="courses-intro">Välj en utbildning och fortsätt i din egen takt.</p>

                <div
                    id="course-catalog"
                    class="course-catalog"
                    aria-live="polite"
                ></div>
            </section>
        </div>
    </main>

    <script>
        const SUPABASE_COURSES_URL =
            "https://nicpgzkkyktzphkyzhfl.supabase.co";

        const SUPABASE_COURSES_KEY =
            "sb_publishable_-u_XwxwKUozPU086NvvKrg_37sY3yXn";

        const supabaseCoursesClient =
            window.supabase.createClient(
                SUPABASE_COURSES_URL,
                SUPABASE_COURSES_KEY
            );

        const courseCatalog =
            document.getElementById(
                "course-catalog"
            );

        function getCourseRoute(course) {

            const explicitRoute =
                course.page_path ||
                course.course_file ||
                course.course_page ||
                course.page_url ||
                course.route ||
                null;

            if (explicitRoute) {

                return explicitRoute;

            }

            if (!course.slug) {

                return null;

            }

            const normalizedSlug =
                String(course.slug).trim();

            if (!normalizedSlug) {

                return null;

            }

            return normalizedSlug.endsWith(".html")
                ? normalizedSlug
                : `${normalizedSlug}.html`;

        }

        function getCourseImage(course) {

            if (
                course.image_path &&
                course.image_path.startsWith("http")
            ) {

                return course.image_path;

            }

            return course.image_path || "icon-courses.png";

        }

        function getCourseCompletionState(course) {

            const completed = Boolean(
                course.completed ||
                course.course_completed ||
                course.is_completed ||
                course.completed_at ||
                course.status === "completed"
            );

            return completed ? "Slutförd" : "Tillgänglig";

        }

        function renderCourseCatalog(courses) {

            if (!courseCatalog) {

                return;

            }

            courseCatalog.innerHTML = "";

            if (!courses.length) {

                courseCatalog.innerHTML = `
                    <article class="course-catalog-card">
                        <img src="icon-courses.png" alt="">
                        <div class="course-catalog-copy">
                            <h2>Inga kurser publicerade ännu</h2>
                            <p>Kurser som läggs till i Supabase visas här automatiskt.</p>
                        </div>
                    </article>
                `;

                return;

            }

            const completedCount =
                courses.filter(
                    course => getCourseCompletionState(course) === "Slutförd"
                ).length;

            const totalCount = courses.length;

            if (courseCatalog) {
                courseCatalog.insertAdjacentHTML(
                    "beforeend",
                    `
                        <article class="course-catalog-overview">
                            <img src="illustration-sauna-stones.png" alt="SaunaPortal illustration">
                            <div class="course-catalog-copy">
                                <h2>Översikt</h2>
                                <p>${completedCount} av ${totalCount} kurser klara.</p>
                                <span class="course-catalog-meta">Total ${totalCount} tillgängliga kurser</span>
                            </div>
                        </article>
                    `
                );
            }

            courses.forEach(
                course => {

                    const article =
                        document.createElement(
                            "article"
                        );

                    article.className =
                        "course-catalog-card";

                    const route =
                        getCourseRoute(course);

                    const title =
                        course.title ||
                        course.slug ||
                        "Kurs";

                    const description =
                        course.description ||
                        "Ingen beskrivning tillgänglig ännu.";

                    const metaParts = [];

                    if (course.lesson_count) {

                        metaParts.push(
                            `${course.lesson_count} steg`
                        );

                    }

                    if (course.category) {

                        metaParts.push(
                            course.category
                        );

                    }

                    const metaText =
                        metaParts.length
                            ? metaParts.join(" · ")
                            : "Tillgänglig";

                    article.innerHTML = `
                        <div class="course-catalog-copy">
                            <h2>${title}</h2>
                            <p>${description}</p>
                            <span class="course-catalog-meta">${metaText} · ${getCourseCompletionState(course)}</span>
                        </div>
                        ${route
                            ? `<a class="primary-button" href="${route}">Öppna kursen →</a>`
                            : `<button class="secondary-button" type="button" disabled>Kommer snart</button>`}
                    `;

                    courseCatalog.appendChild(
                        article
                    );

                }
            );

        }

        async function loadParticipantEnrollments() {

            const participantId =
                localStorage.getItem(
                    "sauna_festival_participant_id"
                );

            if (!participantId) {

                return [];

            }

            try {

                const {
                    data,
                    error
                } = await supabaseCoursesClient
                    .functions
                    .invoke(
                        "festival2026-auth",
                        {
                            body: {
                                action: "get_enrollments",
                                participant_id: participantId
                            }
                        }
                    );

                if (error) {

                    throw error;

                }

                return Array.isArray(data?.enrollments)
                    ? data.enrollments
                    : [];

            } catch (error) {

                console.warn(
                    "⚠️ Could not load participant course enrollments:",
                    error
                );

                return [];

            }

        }

        async function loadCourses() {

            if (!courseCatalog) {

                return;

            }

            courseCatalog.innerHTML = `
                <article class="course-catalog-card">
                    <img src="illustration-sauna-bar.png" alt="">
                    <div class="course-catalog-copy">
                        <h2>Laddar kurser...</h2>
                        <p>Hämtar tillgängliga kurser från "molnet".</p>
                    </div>
                </article>
            `;

            try {

                const {
                    data,
                    error
                } = await supabaseCoursesClient
                    .from(
                        "festival2026_courses"
                    )
                    .select(
                        "*"
                    );

                if (error) {

                    throw error;

                }

                const courses =
                    Array.isArray(data)
                        ? data.filter(
                            course => {

                                if (
                                    course.published !== undefined
                                ) {

                                    return course.published === true;

                                }

                                return true;

                            }
                        )
                        : [];

                const enrollments =
                    await loadParticipantEnrollments();

                const completedCourseIds = new Set(
                    enrollments
                        .filter(
                            enrollment =>
                                enrollment.course_id &&
                                getCourseCompletionState(enrollment) === "Slutförd"
                        )
                        .map(
                            enrollment => enrollment.course_id
                        )
                );

                const completedCourseSlugs = new Set(
                    enrollments
                        .filter(
                            enrollment =>
                                enrollment.slug &&
                                getCourseCompletionState(enrollment) === "Slutförd"
                        )
                        .map(
                            enrollment => enrollment.slug
                        )
                );

                const enrichedCourses = courses.map(
                    course => ({
                        ...course,
                        completed: Boolean(
                            completedCourseIds.has(course.id) ||
                            (course.slug && completedCourseSlugs.has(course.slug))
                        )
                    })
                );

                renderCourseCatalog(
                    enrichedCourses
                );

            } catch (error) {

                console.error(
                    "❌ Could not load courses:",
                    error
                );

                courseCatalog.innerHTML = `
                    <article class="course-catalog-card">
                        <img src="icon-courses.png" alt="">
                        <div class="course-catalog-copy">
                            <h2>Kunde inte ladda kurser</h2>
                            <p>Kontrollera att festival2026_courses finns i Supabase och att publika kurser finns i tabellen.</p>
                        </div>
                    </article>
                `;

            }

        }

        document.addEventListener(
            "DOMContentLoaded",
            loadCourses
        );
    </script>
</body>

</html>
