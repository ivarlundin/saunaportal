<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SaunaPortal - Kurser</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="components.css">

    <link
        rel="icon"
        type="image/png"
        href="favicon-saunaportal.png"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="profile.js" defer></script>

    <style>

        /* =====================================================
           PAGE
           ===================================================== */

        .courses-page .app-container {
            max-width: 920px;
        }

        .courses-page .courses-content {
            padding: 28px 24px 44px;
        }


        /* =====================================================
           COURSE HERO
           
           NOT A TILE.
           No background.
           No border.
           Floating content only.
           ===================================================== */

        .courses-hero {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 32px;

            margin-bottom: 30px;
        }

        .courses-hero-copy {
            flex: 1;
            min-width: 0;
        }

        .courses-hero h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .courses-hero p {
            margin: 0;
            max-width: 520px;
            line-height: 1.45;
        }

        .courses-hero-image {
            width: 250px;
            height: auto;
            max-height: none;

            object-fit: contain;

            display: block;
            flex-shrink: 0;
        }


        /* =====================================================
           COURSE CATALOG
           ===================================================== */

        .course-catalog {
            display: grid;
            gap: 14px;
        }


        /* =====================================================
           COURSE CARD
           ===================================================== */

        .course-catalog-card {
            display: flex;
            align-items: center;

            gap: 18px;

            padding: 18px;

            background: #d4d4d4;

            border: 2px solid;

            border-color:
                #ffffff
                #404040
                #404040
                #ffffff;
        }

        .course-catalog-copy {
            flex: 1;
            min-width: 0;
        }

        .course-catalog-copy h2 {
            margin: 0 0 6px;
            font-size: 20px;
        }

        .course-catalog-copy p {
            margin: 0 0 8px;
            line-height: 1.4;
        }

        .course-catalog-meta {
            display: block;

            color: #404040;

            font-size: 12px;
        }


        /* =====================================================
           COURSE STATUS
           ===================================================== */

        .course-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;

            margin-top: 8px;

            padding: 4px 8px;

            font-size: 11px;
            font-weight: bold;

            text-transform: uppercase;

            border: 2px solid;
        }


        /* Available */

        .course-status.available {
            background: #dfefff;
            color: #000080;

            border-color:
                #ffffff
                #404040
                #404040
                #ffffff;
        }


        /* Completed */

        .course-status.completed {
            background: #c8e6c9;
            color: #155724;

            border-color:
                #ffffff
                #404040
                #404040
                #ffffff;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 560px) {

            .courses-page .courses-content {
                padding: 20px 14px 36px;
            }

            .courses-hero {
                align-items: flex-start;

                gap: 18px;

                margin-bottom: 24px;

                flex-direction: column;
            }

            .courses-hero h1 {
                font-size: 26px;
            }

            .courses-hero-image {
                width: 100%;
                height: auto;
                max-height: none;

                object-fit: contain;
            }

            .course-catalog-card {
                align-items: flex-start;

                flex-direction: column;
            }

            .course-catalog-card .primary-button,
            .course-catalog-card .secondary-button {
                width: 100%;
            }
        }

    </style>

</head>


<body class="courses-page">

    <main>

        <div class="app-container">


            <!-- =================================================
                 HEADER
                 ================================================= -->

            <header class="app-header">

                <img
                    src="sauna-portal-logo.png"
                    class="app-logo"
                    alt="SaunaPortal"
                    style="height: 40px; width: auto;"
                >

                <a
                    class="resource-dashboard-link"
                    href="index.html"
                >
                    Tillbaka till Hem →
                </a>

            </header>


            <!-- =================================================
                 COURSE CONTENT
                 ================================================= -->

            <section class="courses-content">


                <!-- =============================================
                     FLOATING COURSE HERO
                     ============================================= -->

                <div class="courses-hero">

                    <div class="courses-hero-copy">

                        <h1>Kurser</h1>

                        <p>
                            Välj en utbildning och fortsätt i din egen takt.
                        </p>

                    </div>


                    <img
                        class="courses-hero-image"
                        src="illustration-sauna-stones.png"
                        alt="SaunaPortal illustration"
                    >

                </div>


                <!-- =============================================
                     COURSE LIST
                     ============================================= -->

                <div
                    id="course-catalog"
                    class="course-catalog"
                    aria-live="polite"
                ></div>


            </section>

        </div>

    </main>


    <!-- =========================================================
         COURSE JAVASCRIPT
         ========================================================= -->

    <script>

        const SUPABASE_COURSES_URL =
            "https://nicpgzkkyktzphkyzhfl.supabase.co";

        const SUPABASE_COURSES_KEY =
    "sb_publishable_-u_XwxwKUozPU086NvvKrg_37sY3yXn";

        const supabaseCoursesClient =
            window.supabase.createClient(
                SUPABASE_COURSES_URL,
                SUPABASE_COURSES_KEY
            );


        const courseCatalog =
            document.getElementById(
                "course-catalog"
            );


        /* =====================================================
           COURSE ROUTE
           ===================================================== */

        function getCourseRoute(course) {

            const explicitRoute =
                course.page_path ||
                course.course_file ||
                course.course_page ||
                course.page_url ||
                course.route ||
                null;


            if (explicitRoute) {

                return explicitRoute;

            }


            if (!course.slug) {

                return null;

            }


            const normalizedSlug =
                String(course.slug).trim();


            if (!normalizedSlug) {

                return null;

            }


            return normalizedSlug.endsWith(".html")
                ? normalizedSlug
                : `${normalizedSlug}.html`;

        }


        /* =====================================================
           COURSE IMAGE
           ===================================================== */

        function getCourseImage(course) {

            if (
                course.image_path &&
                course.image_path.startsWith("http")
            ) {

                return course.image_path;

            }


            return course.image_path || "icon-courses.png";

        }


        /* =====================================================
           COMPLETION STATE
           ===================================================== */

        function getCourseCompletionState(course) {

            const completed = Boolean(
                course.completed ||
                course.course_completed ||
                course.is_completed ||
                course.completed_at ||
                course.status === "completed"
            );


            return completed
                ? "Slutförd"
                : "Tillgänglig";

        }


        /* =====================================================
           RENDER COURSES
           ===================================================== */

        function renderCourseCatalog(courses) {

            if (!courseCatalog) {

                return;

            }


            courseCatalog.innerHTML = "";


            if (!courses.length) {

                courseCatalog.innerHTML = `

                    <article class="course-catalog-card">

                        <div class="course-catalog-copy">

                            <h2>
                                Inga kurser publicerade ännu
                            </h2>

                            <p>
                                Kurser som läggs till i Supabase
                                visas här automatiskt.
                            </p>

                        </div>

                    </article>

                `;

                return;

            }


            /* =================================================
               RENDER EACH COURSE
               ================================================= */

            courses.forEach(
                course => {

                    const article =
                        document.createElement(
                            "article"
                        );


                    article.className =
                        "course-catalog-card";


                    const route =
                        getCourseRoute(course);


                    const title =
                        course.title ||
                        course.slug ||
                        "Kurs";


                    const description =
                        course.description ||
                        "Ingen beskrivning tillgänglig ännu.";


                    const completed =
                        getCourseCompletionState(course) === "Slutförd";


                    const metaParts = [];


                    if (course.lesson_count) {

                        metaParts.push(
                            `${course.lesson_count} steg`
                        );

                    }


                    if (course.category) {

                        metaParts.push(
                            course.category
                        );

                    }


                    const metaText =
                        metaParts.length
                            ? metaParts.join(" · ")
                            : null;


                    /* =========================================
                       STATUS
                       ========================================= */

                    const statusHtml = completed

                        ? `
                            <span class="course-status completed">
                                ✓ Färdig
                            </span>
                        `

                        : `
                            <span class="course-status available">
                                → Tillgänglig
                            </span>
                        `;


                    /* =========================================
                       BUTTON
                       ========================================= */

                    const buttonHtml = route

                        ? `
                            <a
                                class="primary-button"
                                href="${route}"
                            >
                                ${
                                    completed
                                        ? "Gå till kursen →"
                                        : "Öppna kursen →"
                                }
                            </a>
                        `

                        : `
                            <button
                                class="secondary-button"
                                type="button"
                                disabled
                            >
                                Kommer snart
                            </button>
                        `;


                    /* =========================================
                       CARD HTML
                       ========================================= */

                    article.innerHTML = `

                        <div class="course-catalog-copy">

                            <h2>
                                ${title}
                            </h2>

                            <p>
                                ${description}
                            </p>

                            ${
                                metaText
                                    ? `
                                        <span class="course-catalog-meta">
                                            ${metaText}
                                        </span>
                                    `
                                    : ""
                            }

                            ${statusHtml}

                        </div>

                        ${buttonHtml}

                    `;


                    courseCatalog.appendChild(
                        article
                    );

                }
            );

        }


        /* =====================================================
           LOAD PARTICIPANT ENROLLMENTS
           ===================================================== */

        async function loadParticipantEnrollments() {

            const participantId =
                localStorage.getItem(
                    "sauna_festival_participant_id"
                );


            if (!participantId) {

                return [];

            }


            try {

                const {
                    data,
                    error
                } = await supabaseCoursesClient
                    .functions
                    .invoke(
                        "festival2026-auth",
                        {
                            body: {
                                action: "get_enrollments",
                                participant_id: participantId
                            }
                        }
                    );


                if (error) {

                    throw error;

                }


                return Array.isArray(
                    data?.enrollments
                )
                    ? data.enrollments
                    : [];


            } catch (error) {

                console.warn(
                    "⚠️ Could not load participant course enrollments:",
                    error
                );


                return [];

            }

        }


        /* =====================================================
           LOAD COURSES
           ===================================================== */

        async function loadCourses() {

            if (!courseCatalog) {

                return;

            }


            courseCatalog.innerHTML = `

                <article class="course-catalog-card">

                    <div class="course-catalog-copy">

                        <h2>
                            Laddar kurser...
                        </h2>

                        <p>
                            Hämtar tillgängliga kurser från "molnet".
                        </p>

                    </div>

                </article>

            `;


            try {

                const {
                    data,
                    error
                } = await supabaseCoursesClient
                    .from(
                        "festival2026_courses"
                    )
                    .select(
                        "*"
                    );


                if (error) {

                    throw error;

                }


                const courses =
                    Array.isArray(data)

                        ? data.filter(
                            course => {

                                if (
                                    course.published !== undefined
                                ) {

                                    return course.published === true;

                                }


                                return true;

                            }
                        )

                        : [];


                const enrollments =
                    await loadParticipantEnrollments();


                /* =============================================
                   COMPLETED COURSE IDS
                   ============================================= */

                const completedCourseIds =
                    new Set(

                        enrollments
                            .filter(
                                enrollment =>
                                    enrollment.course_id &&
                                    getCourseCompletionState(
                                        enrollment
                                    ) === "Slutförd"
                            )
                            .map(
                                enrollment =>
                                    enrollment.course_id
                            )

                    );


                /* =============================================
                   COMPLETED COURSE SLUGS
                   ============================================= */

                const completedCourseSlugs =
                    new Set(

                        enrollments
                            .filter(
                                enrollment =>
                                    enrollment.slug &&
                                    getCourseCompletionState(
                                        enrollment
                                    ) === "Slutförd"
                            )
                            .map(
                                enrollment =>
                                    enrollment.slug
                            )

                    );


                /* =============================================
                   ENRICH COURSES
                   ============================================= */

                const enrichedCourses =
                    courses.map(
                        course => ({

                            ...course,

                            completed:
                                Boolean(

                                    completedCourseIds.has(
                                        course.id
                                    )

                                    ||

                                    (
                                        course.slug &&
                                        completedCourseSlugs.has(
                                            course.slug
                                        )
                                    )

                                )

                        })
                    );


                renderCourseCatalog(
                    enrichedCourses
                );


            } catch (error) {

                console.error(
                    "❌ Could not load courses:",
                    error
                );


                courseCatalog.innerHTML = `

                    <article class="course-catalog-card">

                        <div class="course-catalog-copy">

                            <h2>
                                Kunde inte ladda kurser
                            </h2>

                            <p>
                                Kontrollera att
                                festival2026_courses finns i Supabase
                                och att publika kurser finns i tabellen.
                            </p>

                        </div>

                    </article>

                `;

            }

        }


        /* =====================================================
           INIT
           ===================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            loadCourses
        );

    </script>

</body>

</html>
