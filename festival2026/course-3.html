<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <title>Kurs 3 - Aufguss - Grunderna</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="course.css">
    <link rel="stylesheet" href="components.css">
    <link
        rel="icon"
        type="image/png"
        href="favicon-saunaportal.png"
    >
</head>
<body class="course-page">
    <main id="course-app">
        <div class="app-container course-container">
            <header class="app-header">
                <a class="course-brand">Kurs 3 - Aufguss - Grunderna</a>
                <a class="course-dashboard-link" href="courses.html">Tillbaka till kurser →</a>
            </header>

            <section id="course-modal" class="course-modal">
                <div class="course-modal-header">
                    <span id="course-progress" class="step-indicator">STEG 1 AV 2</span>
                </div>
                <div id="course-content" class="step-content"></div>

                <div class="course-navigation">
                    <button type="button" id="course-back" class="secondary-button">← Tillbaka</button>
                    <button type="button" id="course-next" class="primary-button">Nästa →</button>
                </div>
            </section>

            <section id="quiz-panel" class="course-panel" hidden>
                <div class="course-panel-header">
                    <span class="course-mode-label">Quiz</span>
                    <span id="quiz-progress" class="step-indicator">FRÅGA 1 AV 4</span>
                </div>
                <div id="quiz-content" class="step-content"></div>
                <div class="course-navigation">
                    <button type="button" id="quiz-back" class="secondary-button">← Föregående steg</button>
                    <button type="button" id="quiz-next" class="primary-button">Svara →</button>
                </div>
                <div id="quiz-status" class="status course-status" aria-live="polite"></div>
            </section>

            <section id="result-panel" class="course-panel result-content" hidden>
                <div class="result-icon">✓</div>
                <h1>Kurs klar!</h1>
                <p id="result-message">Ditt resultat visas här.</p>
                <div id="result-score" class="result-score">0%</div>
                <button type="button" id="result-dashboard" class="primary-button full-width">Tillbaka till Hem →</button>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="course-quiz.js"></script>
    <script>
        const courseSteps = [
            {
                title: "Videokurs",
                content: `
                    <p>Du kommer nu få att se ett videoklipp där du kommer få lära dig:</p>
                    <ul>
                        <li>Grunderna i Aufguss</li>
                        <li>Säkerhet vid ritualen</li>
                        <li>Tips & tricks</li>
                    </ul>
                    <div class="course-content-box">
                        <strong>Nästa steg</strong>
                        <p>Klicka på "Nästa" för att se videon.</p>
                    </div>`
            },
            {
                title: "Videokurs",
                content: `
                    <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin-bottom: 20px; background: #000;">
                        <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" src="https://www.youtube.com/embed/r_S5UAajMFw?si=9dJPSPZiG5uymDIM" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                    </div>`
            }
        ];

        const quizQuestions = [
            {
                question: "Vad är en viktig komponent i en Aufguss-ritual?",
                answers: [
                    "Vatten, eteriska oljor och handduksrörelser",
                    "Bara varmt vatten",
                    "Endast handduksrörelser utan oljor"
                ]
            },
            {
                question: "Vad är en potentiell fördel med att använda eteriska oljor i en Aufguss?",
                answers: [
                    "De förstärker effekten av värmen och bidrar till avslappning",
                    "De gör vattnet varmare",
                    "De förhindrar att handdukarna blir för våta"
                ]
            },
            {
                question: "Vad är en viktig säkerhetsåtgärd när man utför en Aufguss-ritual?",
                answers: [
                    "Hälla oljan direkt på de heta stenarna",
                    "Blanda innehållet i hinken innan vi häller på stenarna",
                    "Använda så mycket olja som möjligt för starkare doft"
                ]
            },
            {
                question: "Vilken är en korrekt teknik för att sprida värmen och doften under en Aufguss-ritual?",
                answers: [
                    "Använda kraftiga, oregelbundna rörelser med handduken",
                    "Vifta med handduken rytmiskt och mjukt",
                    "Låta handduken ligga still på lavarna"
                ]
            }
        ];

        CourseQuiz.init({
            courseSlug: "course-3",
            courseSteps,
            quizQuestions
        });
    </script>
</body>
</html>
