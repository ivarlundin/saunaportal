<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kurs 2 - Eldning 101</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="course.css">
    <link rel="stylesheet" href="components.css">
</head>
<body class="course-page">
    <main id="course-app">
        <div class="app-container course-container">
            <header class="app-header">
                <a class="course-brand" href="index.html">Kurs 2 - Eldning 101</a>
                <a class="course-dashboard-link" href="index.html">Tillbaka till Hem →</a>
            </header>

            <section id="course-modal" class="course-modal">
                <div class="course-modal-header">
                    <span id="course-progress" class="step-indicator">STEG 1 AV 2</span>
                </div>
                <div id="course-content" class="step-content"></div>

                <div class="course-navigation">
                    <button type="button" id="course-back" class="secondary-button">← Tillbaka</button>
                    <button type="button" id="course-next" class="primary-button">Nästa →</button>
                </div>
            </section>

            <section id="quiz-panel" class="course-panel" hidden>
                <div class="course-panel-header">
                    <span class="course-mode-label">Quiz</span>
                    <span id="quiz-progress" class="step-indicator">FRÅGA 1 AV 4</span>
                </div>
                <div id="quiz-content" class="step-content"></div>
                <div class="course-navigation">
                    <button type="button" id="quiz-back" class="secondary-button">← Föregående steg</button>
                    <button type="button" id="quiz-next" class="primary-button">Svara →</button>
                </div>
                <div id="quiz-status" class="status course-status" aria-live="polite"></div>
            </section>

            <section id="result-panel" class="course-panel result-content" hidden>
                <div class="result-icon">✓</div>
                <h1>Kurs klar!</h1>
                <p id="result-message">Ditt resultat visas här.</p>
                <div id="result-score" class="result-score">0%</div>
                <button type="button" id="result-dashboard" class="primary-button full-width">Tillbaka till Hem →</button>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="course-quiz.js"></script>
    <script>
        const courseSteps = [
            {
                title: "Videokurs",
                content: `
                    <p>Du kommer nu få att se ett videoklipp där du kommer få lära dig:</p>
                    <ul>
                        <li>Grunderna i eldning</li>
                        <li>Säkerhet vid eldning</li>
                        <li>Tips & tricks</li>
                    </ul>
                    <div class="course-content-box">
                        <strong>Nästa steg</strong>
                        <p>Klicka på "Nästa" för att se videon.</p>
                    </div>`
            },
            {
                title: "Videokurs",
                content: `
                    <div style="position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 8px; margin-bottom: 20px; background: #000;">
                        <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" src="https://www.youtube.com/embed/KXHmfVsB524?si=4cpanPHDPNMSjSFc" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                    </div>`
            }
        ];

        const quizQuestions = [
            {
                question: "Hur tänder vi kaminen?",
                answers: [
                    "Kolla ventiler är stängda, bygg ett cirkulärt lager med ved och tändkuddarna bredvid",
                    "Placera vedträn luftigt, tänd först på de största vedklabbarna och släng in tidningspapper vid behov",
                    "Öppna ventiler, bygg fyrkantiga lager och tänd på tändkuddar under översta vedlagret."
                ]
            },
            {
                question: "Vilket flöde av förbränningsluft vill vi ha?",
                answers: [
                    "Mycket -> Lågt -> Mer vid glöd",
                    "Lågt -> Medium -> Mycket",
                    "Mycket -> Lågt -> Inget"
                ]
            },
            {
                question: "Vilket av följande är god förberedelse för en eldning?",
                answers: [
                    "Lövved, 20 st stora klabbar och ett elddon",
                    "Barrved, 15 mindre klabbar och tändvätska",
                    "Lövved, blandade storlekar av klabbar och tändkuddar/tändstickor"
                ]
            },
            {
                question: "Vad indikerar bra eldning och ventilation?",
                answers: [
                    "Tydlig rökdoft i bastun, svaga gula lågor",
                    "Svag rökdoft, kraftfulla röda lågor och en känsla av syre",
                    "Liten till ej märkbar rökdoft, kraftfulla gula lågor"
                ]
            }
        ];

        CourseQuiz.init({
            courseSlug: "course-2",
            courseSteps,
            quizQuestions
        });
    </script>
</body>
</html>
