<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <script src="platform.js"></script>

    <title>SaunaPortal - Intyg</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="components.css">
    <link rel="stylesheet" href="diplomas.css">

    <link
        rel="icon"
        type="image/png"
        href="favicon-saunaportal.png"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="profile.js" defer></script>
</head>

<body class="courses-page diplomas-page">

    <main>
        <div class="app-container">

            <header class="app-header">
                <img
                    src="sauna-portal-logo.png"
                    class="app-logo"
                    alt="SaunaPortal"
                    style="height: 40px; width: auto;"
                >

                <a class="resource-dashboard-link" href="index.html">
                    Tillbaka till Hem →
                </a>
            </header>

            <section class="courses-content">

                <div class="courses-hero">
                    <div class="courses-hero-copy">
                        <h1>Mina intyg</h1>
                        <p>
                            Här samlas kursintyg för utbildningar du har klarat.
                            Öppna ett intyg för att visa eller skriva ut det.
                        </p>
                    </div>

                    <img
                        class="courses-hero-image"
                        src="illustration-certified.png"
                        alt="Certifiering"
                    >
                </div>

                <div
                    id="diploma-catalog"
                    class="course-catalog"
                    aria-live="polite"
                ></div>

            </section>

        </div>
    </main>

    <script src="diplomas.js"></script>

</body>

</html>
